<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <title>Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0f19;
      --bg-surface: #111827;
      --bg-highlight: #1c2333;
      --fg: #d1d5e4;
      --fg-dim: #8a93ad;
      --fg-bright: #e8ecf4;
      --accent: #e5a042;
      --accent-dim: rgba(229, 160, 66, 0.15);
      --red: #f87171;
      --border: rgba(255, 255, 255, 0.06);
      --border-strong: rgba(255, 255, 255, 0.1);
      --radius: 6px;
      --radius-sm: 3px;
      --font-mono: 'IBM Plex Mono', 'SF Mono', 'Cascadia Code', monospace;
      --font-display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
    }

    [data-theme="light"] {
      --bg: #f3f4f6;
      --bg-surface: #ffffff;
      --bg-highlight: #e9ecf0;
      --fg: #1e293b;
      --fg-dim: #576275;
      --fg-bright: #0f172a;
      --accent: #8c5e1b;
      --accent-dim: rgba(140, 94, 27, 0.1);
      --red: #dc2626;
      --border: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.12);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 0%, rgba(229, 160, 66, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(103, 232, 249, 0.02) 0%, transparent 50%);
    }

    .settings-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 32px;
      width: 380px;
      max-width: 90vw;
      position: relative;
    }

    .settings-box::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20%;
      right: 20%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 1px;
    }

    h2 {
      font-family: var(--font-display);
      color: var(--accent);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 24px;
    }

    label, .section-label {
      display: block;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--fg-dim);
      margin-bottom: 5px;
    }

    /* Mode selector — segmented control */
    .mode-selector {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .mode-selector input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .mode-selector label {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--fg-dim);
      background: var(--bg);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 0;
      border-right: 1px solid var(--border);
      user-select: none;
    }

    .mode-selector label:last-of-type {
      border-right: none;
    }

    .mode-selector label:hover {
      color: var(--fg-bright);
      background: var(--bg-highlight);
    }

    .mode-selector input[type="radio"]:checked + label {
      background: var(--accent-dim);
      color: var(--accent);
    }

    .mode-selector input[type="radio"]:focus-visible + label {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    /* URL field groups */
    .url-group {
      transition: opacity 0.15s, max-height 0.2s;
      overflow: hidden;
    }

    .url-group.hidden {
      opacity: 0.3;
      pointer-events: none;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      margin-bottom: 4px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    input[type="text"]::placeholder {
      color: var(--fg-dim);
      opacity: 0.8;
    }

    input[type="text"].invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.15);
    }

    .field-error {
      color: var(--red);
      font-size: 11px;
      font-family: var(--font-display);
      margin-bottom: 12px;
      min-height: 16px;
      visibility: hidden;
    }

    .field-error.visible {
      visibility: visible;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: var(--radius-sm);
      font: inherit;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: filter 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0b0f19;
    }

    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; filter: none; }

    .btn-secondary {
      background: var(--bg-highlight);
      color: var(--fg-dim);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover { color: var(--fg-bright); }

    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      input, button, .url-group, .mode-selector label { transition: none; }
    }
  </style>
</head>
<body>
  <div class="settings-box">
    <h2>Connection Settings</h2>

    <div class="section-label">Mode</div>
    <div class="mode-selector" role="radiogroup" aria-label="Connection mode">
      <input type="radio" name="mode" id="mode-server" value="server">
      <label for="mode-server">Server Only</label>
      <input type="radio" name="mode" id="mode-both" value="both">
      <label for="mode-both">Both</label>
      <input type="radio" name="mode" id="mode-console" value="console">
      <label for="mode-console">Console Only</label>
    </div>

    <div class="url-group" id="server-group">
      <label for="server-url">Server URL</label>
      <input type="text" id="server-url" placeholder="http://localhost:8080" autofocus>
      <div class="field-error" id="server-url-error">Enter a valid URL (http:// or https://)</div>
    </div>

    <div class="url-group" id="console-group">
      <label for="console-url">Console URL</label>
      <input type="text" id="console-url" placeholder="http://localhost:8090">
      <div class="field-error" id="console-url-error">Enter a valid URL (http:// or https://)</div>
    </div>

    <div class="btn-row">
      <button class="btn-secondary" id="btn-cancel">Cancel</button>
      <button class="btn-primary" id="btn-save">Save</button>
    </div>
  </div>
  <script src="settings.js"></script>
</body>
</html>
